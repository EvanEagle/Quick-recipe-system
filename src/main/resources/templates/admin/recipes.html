<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>食譜管理系統</title>
    <!-- 引入共用 CSS -->
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico?v=1}">
</head>
<body>

    <!-- 引入後台共用導覽列 -->
    <div th:replace="~{layout/fragments :: header}"></div>

     <div class="message-block">
            <span th:if="${successMsg}" th:text="${successMsg}" class="msg-success"></span>
            <span th:if="${errorMsg}" th:text="${errorMsg}" class="msg-error"></span>
    </div>

    <main class="admin-container">
        <h1 class="title">食譜管理清單</h1>

        <!-- 功能列：新增官方食譜按鈕 -->
        <div style="text-align: right; margin-bottom: 20px;">
            <a th:href="@{/admin/recipes/add}" class="btn-toggle" style="background-color: var(--accent-orange); text-decoration: none;">
                + 新增官方食譜
            </a>
        </div>

        <!-- 數據表格區塊 -->
        <div class="admin-section">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>食譜 ID</th>
                        <th>食譜名稱</th>
                        <th>建立者</th>
                        <th>食譜類型</th>
                        <th>管理操作</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 展開食譜清單 -->
                <tr th:each="recipe : ${recipes}">
                    <td th:text="${recipe.id}">食譜ID</td>
                    <td><a th:href="@{/recipe/detail/{id}(id=${recipe.id})}"
                        class="recipe-name-link" th:text="${recipe.name}">
                            食譜名稱
                        </a>
                    </td>
                    <td th:text="${recipe.author}">建立者</td>
                    
                    <!-- 食譜類型 -->
                    <td>
                        <span class="status-badge" 
                            th:classappend="${recipe.systemRecipe} ? 'type-system' : 'type-diy'"
                            th:text="${recipe.systemRecipe} ? '官方食譜' : '會員 DIY'">
                        </span>
                    </td>

                    <!-- 管理操作 -->
                    <td>
                        <div class="recipe-actions">

                            <!-- 強制下架 / 刪除 -->
                            <form th:action="@{/admin/recipes/delete/{id}(id=${recipe.id})}"
                                method="post"
                                onsubmit="return confirm('確定要執行此操作嗎？此動作無法復原！');">

                                <button type="submit"
                                        class="btn-toggle btn-danger"
                                        th:text="${recipe.systemRecipe} ? '刪除食譜' : '強制下架'">
                                    刪除
                                </button>
                            </form>

                            <!-- 官方食譜才可以修改 -->
                            <a th:if="${recipe.systemRecipe}"
                            th:href="@{/admin/recipes/edit/{id}(id=${recipe.id})}"
                            class="btn-action edit">

                                <i class="fa-solid fa-pen-to-square"></i>
                                修改
                            </a>

                        </div>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
