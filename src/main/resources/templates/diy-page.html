<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY 食譜管理 - 快速料理小幫手</title>
    
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/diy-page.css}"> 
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico?v=1}">
</head>
<body>
    <header th:replace="~{layout/fragments :: header}"></header>

    <main class="diy-container">
        
        <div class="message-block">
            <span th:if="${successMsg}" th:text="${successMsg}" class="msg-success"></span>
            <span th:if="${errorMsg}" th:text="${errorMsg}" class="msg-error"></span>
        </div>

        <div class="page-header">
            <h1 class="page-title">📝 我的 DIY 食譜庫</h1>
            <a th:href="@{/recipe/add}" class="btn-add-new">➕ 新增私房菜</a>
        </div>
        
        <div th:if="${#lists.isEmpty(diyRecipes)}" class="empty-state-card">
            <div class="empty-state-icon">👨‍🍳</div>
            <p class="empty-state-text">你還沒有建立過任何私房食譜喔！</p>
            <a th:href="@{/recipe/add}" class="btn-add-new">馬上動手寫一篇</a>
        </div>
        
        <div th:unless="${#lists.isEmpty(diyRecipes)}">
            
            <div class="diy-grid-container">
                
                <div th:each="recipe : ${diyRecipes}" class="diy-summary-card">
                    
                    <div class="card-img-wrapper">
                        <img th:src="@{${recipe.imageUrl != null ? recipe.imageUrl : '/images/Notuploaded.jpg'}}" 
                             alt="食譜圖片" class="card-img">
                    </div>

                    <div class="card-info">
                        <h3 class="recipe-title" th:text="${recipe.name}">食譜名稱</h3>
                        <p class="recipe-meta">
                            <span th:text="|🎌 分類：${recipe.typeString}|"></span> | 
                            <span th:text="|⏱️ ${recipe.cookingTime} 分鐘|"></span>
                        </p>
                        
                        <div class="tags-container" th:if="${not #lists.isEmpty(recipe.keywords)}">
                            <span th:each="keyword : ${recipe.keywords}" class="keyword-tag" th:text="|#${keyword}|"></span>
                        </div>

                        <div class="card-actions">
                            
                            <a th:href="@{/recipe/detail/{id}(id=${recipe.id})}" class="btn-action btn-detail" title="查看詳情">📄查看</a>
                            
                            <a th:href="@{/recipe/edit/{id}(id=${recipe.id})}" class="btn-action btn-edit" title="編輯食譜">✏️編輯</a>
                            
                            <form th:action="@{/recipe/delete/{id}(id=${recipe.id})}" method="post" style="margin: 0; display: flex;">
                                <button type="submit" class="btn-action btn-delete" 
                                        th:data-name="${recipe.name}"
                                        onclick="return confirm('確定要刪除「' + this.getAttribute('data-name') + '」嗎？這將無法復原喔！');" 
                                        title="刪除食譜">
                                    🗑️刪除
                                </button>
                            </form>
                            
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </main>

    <footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
