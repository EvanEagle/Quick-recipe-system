<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" xmlns:th="http://www.thymeleaf.org">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickCook 快速料理小幫手</title>

    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico?v=1}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
    <!-- 引入標題及導覽列 -->
    <div th:replace="~{layout/fragments :: header}"></div>

    <!--main主要內容-->
    <main class="main-wrapper">
        <section class="search-section">  <!--section有主題的內容區塊-->
           <form th:action="@{/recipe}" method="get" id="searchForm" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                
                <div class="search-bar-container">
                    <input type="text" name="keyword" class="search-bar-input" placeholder="搜尋食譜(支援菜名、食材、標籤)" th:value="${selectedKeyword}">
                    <button type="submit" class="search-btn">
                        <span class="material-symbols-outlined">🔍</span>
                    </button>
                </div>
                
                <div class="filter-tags">
                    <select name="cookingtime" class="tag-btn" onchange="this.form.submit()">
                        <option value="">烹調時間</option>
                        <option value="10mins" th:selected="${selectedTime == '10mins'}">10分鐘</option>
                        <option value="20mins" th:selected="${selectedTime == '20mins'}">20分鐘</option>
                        <option value="30mins" th:selected="${selectedTime == '30mins'}">30分鐘</option>
                        <option value="30mins up" th:selected="${selectedTime == '30mins up'}">30分鐘以上</option>
                    </select>
                    
                    <select name="author" class="tag-btn" onchange="this.form.submit()">
                        <option value="">作者</option>
                        <option value="QuickCook官方" th:selected="${selectedAuthor == 'QuickCook官方'}">官方嚴選</option>
                        <option value="Arden" th:selected="${selectedAuthor == 'Arden'}">Arden</option>
                    </select>
                    
                    
                    
                    <button type="submit" name="typeString" value="中式" class="tag-btn" 
                            th:style="${selectedType == '中式' ? 'background-color:#E2E8D5; font-weight:bold;' : ''}">中式料理</button>
                    <button type="submit" name="typeString" value="日式" class="tag-btn"
                            th:style="${selectedType == '日式' ? 'background-color:#E2E8D5; font-weight:bold;' : ''}">日式料理</button>
                    <button type="submit" name="typeString" value="西式" class="tag-btn"
                            th:style="${selectedType == '西式' ? 'background-color:#E2E8D5; font-weight:bold;' : ''}">西式料理</button>
                    
                    <a th:href="@{/home}" class="tag-btn" style="text-decoration: none; color: #ba714d;" 
                       th:if="${selectedKeyword != null or selectedTime != null or selectedType != null}">✖ 清除搜尋</a>
                </div>
            </form>
        </section>

        <div class="content-area">   <!--卡片一個大區塊-->
            <section class="recipe-grid">  <!--section有主題的內容區塊-->
                <a href="#" class="recipe-card">  <!--a點擊卡片會進入另一個網頁-->
                    <div class="card-img-container"> <!--圖片一個區塊-->
                        <img th:src="@{/images/food1.jpg}" alt="美食圖片" class="card-img">
                    </div>
                    <div class="card-info"> <!--文字一個區塊-->
                            <h3 class="recipe-title">Avocado Salmon Salad</h3>
                            <p class="recipe-desc">酪梨鮭魚沙拉，人氣必點清爽健康美味...</p>
                        <div class="card-actions"> <!--按鈕的區塊-->
                            <button class="btn-detail">查看詳情</button> <!--button 查看詳情 按鈕-->
                            <button class="btn-collect">加入收藏</button> <!--button 加入收藏 按鈕-->
                        </div>
                    </div>
                </a>

                <a href="#" class="recipe-card">
                    <div class="card-img-container">
                        <img th:src="@{/images/food1.jpg}" alt="美食圖片" class="card-img">
                    </div>
                    <div class="card-info">
                        <div>
                            <h3 class="recipe-title">Avocado Salmon Salad</h3>
                            <p class="recipe-desc">酪梨鮭魚沙拉，人氣必點清爽健康美味...</p>
                        </div>
                        <div class="card-actions">
                            <button class="btn-detail">查看詳情</button>
                            <button class="btn-collect">加入收藏</button>
                        </div>
                    </div>
                </a>

                <a href="#" class="recipe-card">
                    <div class="card-img-container">
                        <img th:src="@{/images/food1.jpg}" alt="美食圖片" class="card-img">
                    </div>
                    <div class="card-info">
                        <div>
                            <h3 class="recipe-title">Avocado Salmon Salad</h3>
                            <p class="recipe-desc">酪梨鮭魚沙拉，人氣必點清爽健康美味...</p>
                        </div>
                        <div class="card-actions">
                            <button class="btn-detail">查看詳情</button>
                            <button class="btn-collect">加入收藏</button>
                        </div>
                    </div>
                </a>

                <a href="#" class="recipe-card">
                    <div class="card-img-container">
                        <img th:src="@{/images/food1.jpg}" alt="美食圖片" class="card-img">
                    </div>
                    <div class="card-info">
                        <div>
                            <h3 class="recipe-title">Avocado Salmon Salad</h3>
                            <p class="recipe-desc">酪梨鮭魚沙拉，人氣必點清爽健康美味...</p>
                        </div>
                        <div class="card-actions">
                            <button class="btn-detail">查看詳情</button>
                            <button class="btn-collect">加入收藏</button>
                        </div>
                    </div>
                </a>
                </section>

            <aside class="diy-sidebar">
                <div>
                    <h2 class="diy-title">我的DIY食譜</h2> 
                    
                    <ul th:if="${not #lists.isEmpty(diyRecipes)}" class="diy-list">
                        <li th:each="recipe : ${diyRecipes}" class="diy-item">
                            
                            <span class="recipe-name" th:text="${recipe.name}">動態食譜名稱</span>
                            
                            <div class="action-group">
                                <a th:href="@{/recipe/edit/{id}(id=${recipe.id})}" class="btn-action edit">
                                    <i class="fa-solid fa-pen-to-square"></i> 修改
                                </a>
                                
                                <form th:action="@{/recipe/delete/{id}(id=${recipe.id})}" method="post" style="margin: 0; display: inline-flex;">
    
                                    <button type="submit" 
                                            class="btn-action delete" 
                                            th:data-name="${recipe.name}"
                                            onclick="return confirm('警告：確定要將「' + this.getAttribute('data-name') + '」永久刪除嗎？此動作無法復原！');"
                                            style="border: none; cursor: pointer; font-family: inherit;">
                                        <i class="fa-solid fa-trash-can"></i> 刪除
                                    </button>
                                    
                                </form>
                            </div>
                        </li>
                    </ul>

                    <div th:if="${#lists.isEmpty(diyRecipes)}" class="empty-state">
                        <p>目前還沒有創立食譜唷！</p>
                        <p>點擊下方新增第一道私房菜吧 👇</p>
                    </div>
                </div>
                
                <div class="diy-add-container">
                    <span class="diy-add-text">新增食譜</span>
                    
                    <a th:if="${session.loggedInUser == null}" 
                    href="#" 
                    onclick="alert('哈囉！請先登入才能「新增食譜」喔！'); return false;" 
                    class="btn-diy-add">+</a>
                    
                    <a th:unless="${session.loggedInUser == null}" 
                    th:href="@{/recipe/add}" 
                    class="btn-diy-add">+</a>
                </div>
            </aside>
        </div>
    </main>

    <!-- 引入頁尾 -->
    <div th:replace="~{layout/fragments :: footer}"></div>

</body>
</html>
