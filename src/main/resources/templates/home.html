<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" xmlns:th="http://www.thymeleaf.org">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickCook 快速料理小幫手</title>

    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico?v=1}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
    <!-- 引入標題及導覽列 -->
    <div th:replace="~{layout/fragments :: header}"></div>

    <div style="text-align: center; margin-bottom: 20px;">
            <span th:if="${successMsg}" th:text="${successMsg}" style="color: #2E8B57; font-weight: bold; background-color: #e6f4ea; padding: 10px 20px; border-radius: 8px; display: inline-block;"></span>
            <span th:if="${errorMsg}" th:text="${errorMsg}" style="color: #ba714d; font-weight: bold; background-color: #fbe9e7; padding: 10px 20px; border-radius: 8px; display: inline-block;"></span>
    </div>

    <!--main主要內容-->
    <main class="main-wrapper">
        <section class="search-section">  <!--section有主題的內容區塊-->
           <form th:action="@{/search}" method="get" id="searchForm" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                
                <div class="search-bar-container">
                    <input type="text" name="keyword" class="search-bar-input" placeholder="搜尋食譜(支援菜名、食材、標籤)" th:value="${selectedKeyword}">
                    <button type="submit" class="search-btn">
                        <span class="material-symbols-outlined">🔍</span>
                    </button>
                </div>
                
                <div class="filter-tags">
                    <select name="cookingtime" class="tag-btn" onchange="this.form.submit()">
                        <option value="">烹調時間</option>
                        <option value="10mins" th:selected="${selectedTime == '10mins'}">10分鐘</option>
                        <option value="20mins" th:selected="${selectedTime == '20mins'}">20分鐘</option>
                        <option value="30mins" th:selected="${selectedTime == '30mins'}">30分鐘</option>
                        <option value="30mins up" th:selected="${selectedTime == '30mins up'}">30分鐘以上</option>
                    </select>
                    
                    <select name="source" class="tag-btn" onchange="this.form.submit()">
                        <option value="">食譜來源</option>
                        <option value="official">官方食譜</option>
                    </select>
                    
                    <button type="submit" name="typeString" value="Chinese" class="tag-btn" 
                            th:style="${selectedType == 'Chinese' ? 'background-color:#E2E8D5; font-weight:bold;' : ''}">中式料理</button>
                    <button type="submit" name="typeString" value="Japanese" class="tag-btn"
                            th:style="${selectedType == 'Japanese' ? 'background-color:#E2E8D5; font-weight:bold;' : ''}">日式料理</button>
                    <button type="submit" name="typeString" value="Western" class="tag-btn"
                            th:style="${selectedType == 'Western' ? 'background-color:#E2E8D5; font-weight:bold;' : ''}">西式料理</button>
                    
                    <a th:href="@{/home}" class="tag-btn" style="text-decoration: none; color: #ba714d;" 
                       th:if="${selectedKeyword != null or selectedTime != null or selectedType != null}">✖ 清除搜尋</a>
                </div>
            </form>
        </section>

        <div class="content-area">   <!--卡片一個大區塊-->
            <section class="recipe-grid">
    
                <div th:each="recipe : ${randomRecipes}" class="recipe-card">
                    
                    <div class="card-img-container">
                        <img th:src="@{${recipe.imageUrl != null ? recipe.imageUrl : '/images/system/not-uploaded.jpg'}}" alt="美食圖片" class="card-img">
                    </div>
                    
                    <div class="card-info">
                        <div>
                            <h3 class="recipe-title" th:text="${recipe.name}">動態食譜名稱</h3>
                            <p class="recipe-author" th:text="${recipe.systemRecipe} ? '👨‍🍳 官方食譜' : |👨‍🍳 作者：${recipe.author}|">作者名稱</p>
                        <p class="recipe-time">⏱️ 烹調時間：<span th:text="${recipe.cookingTime}"></span> 分鐘</p>
                        
                        
                        </div>
                        
                        <div class="card-actions">
                            <a th:href="@{/recipe/detail/{id}(id=${recipe.id})}" class="btn-detail" 
                            style="color: #403e3e; text-align: center; text-decoration: none; box-sizing: border-box; font-weight: bold;">
                            查看詳情
                            </a>
                            
                            <form th:if="${session.loggedInUserRole != 'ROLE_ADMIN'}" 
                                    th:action="@{/favorite/add}" method="post" style="margin: 0; flex: 1; display: flex;">
                                <input type="hidden" name="recipeId" th:value="${recipe.id}" />
                                <button type="submit" class="btn-collect" style="width: 100%;">加入收藏</button>
                            </form>
                            
                        </div>
                    </div>
                    
                </div>
                
            </section>

            <aside class="diy-sidebar">
                <div>
                    <h2 class="diy-title"
                        th:text="${session.loggedInUserRole == 'ROLE_ADMIN'} ? '官方食譜管理' : '我的DIY食譜'">
                        我的DIY食譜
                    </h2>

                    <!-- 有食譜時 -->
                    <ul th:if="${not #lists.isEmpty(manageRecipes)}" class="diy-list">
                        <li th:each="recipe : ${manageRecipes}" class="diy-item">
                            
                            <span class="recipe-name" th:text="${recipe.name}">動態食譜名稱</span>
                            
                            <div class="action-group">
                                <a th:href="${session.loggedInUserRole == 'ROLE_ADMIN'}
                                    ? @{/admin/recipes/edit/{id}(id=${recipe.id})}
                                    : @{/recipe/edit/{id}(id=${recipe.id})}" class="btn-action edit">
                                    <i class="fa-solid fa-pen-to-square"></i> 修改
                                </a>
                                
                                <form th:action="${session.loggedInUserRole == 'ROLE_ADMIN'}? 
                                    @{/admin/recipes/delete/{id}(id=${recipe.id})}
                                    : @{/recipe/delete/{id}(id=${recipe.id})}" 
                                    method="post" style="margin: 0; display: inline-flex;">
    
                                    <button type="submit" 
                                            class="btn-action delete" 
                                            th:data-name="${recipe.name}"
                                            onclick="return confirm('警告：確定要將「' + this.getAttribute('data-name') + '」永久刪除嗎？此動作無法復原！');"
                                            style="border: none; cursor: pointer; font-family: inherit;">
                                        <i class="fa-solid fa-trash-can"></i> 刪除
                                    </button>
                                    
                                </form>

                            </div>
                        </li>
                    </ul>

                    <!-- 沒有食譜時 -->
                    <div th:if="${#lists.isEmpty(manageRecipes)}" class="empty-state">
                        <p>目前還沒有創立食譜唷！</p>
                        <p>點擊下方新增第一道私房菜吧 👇</p>
                    </div>
                </div>
                
               
                <div class="diy-add-container">
                    <span class="diy-add-text">新增食譜</span>
                    
                    <a th:if="${session.loggedInUser == null}" 
                        href="#" 
                        onclick="alert('哈囉！請先登入才能「新增食譜」喔！'); return false;" 
                        class="btn-diy-add">
                        +
                    </a>
                    
                    <a th:unless="${session.loggedInUser == null}" 
                        th:href="${session.loggedInUserRole == 'ROLE_ADMIN'} ? @{/admin/recipes/add} : @{/recipe/add}" 
                        class="btn-diy-add">
                        +
                    </a>
                </div>
            </aside>
        </div>
    </main>

    <!-- 引入頁尾 -->
    <div th:replace="~{layout/fragments :: footer}"></div>

</body>
</html>
