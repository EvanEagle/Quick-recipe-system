<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - 快速料理小幫手</title>
    
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/recipe-list.css}"> 
    <link rel="stylesheet" th:href="@{/css/favorite.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico?v=1}">
</head>
<body>
    <header th:replace="~{layout/fragments :: header}"></header>

    <main class="favorite-container">
        
        <div class="message-block">
            <span th:if="${successMsg}" th:text="${successMsg}" class="msg-success"></span>
        </div>

        <h1 class="page-title">❤️ 我收藏的美味食譜</h1>
        
        <div th:if="${#lists.isEmpty(favorites)}" class="empty-state-card">
            <div class="empty-state-icon">🍳</div>
            <p class="empty-state-text">目前的收藏清單空空如也喔！</p>
            <a th:href="@{/recipe}" class="btn-go-explore">🔍 馬上去探索食譜</a>
        </div>
        
        <div th:unless="${#lists.isEmpty(favorites)}">
            
            <div th:each="recipe : ${favorites}" class="recipe-detail-card">
                
                <div class="recipe-header">
                    <h3 th:text="${recipe.name}">食譜名稱</h3>
                    <span class="cooking-time">⏱️ 烹調時間：<span th:text="${recipe.cookingTime}"></span> 分鐘</span>
                </div>

                <div th:if="${recipe.videoUrl != null}" class="video-container">
                    <iframe width="100%" height="315" 
                            th:src="${recipe.videoUrl}" 
                            title="YouTube video player" frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                    </iframe>
                </div>

                <div class="recipe-content">
                    <h4>🛒 食材：</h4>
                    <ul>
                        <li th:each="ingredient : ${recipe.ingredients}" th:text="${ingredient}"></li>
                    </ul>

                    <h4>🧂 調味料：</h4>
                    <ul>
                        <li th:each="seasoning : ${recipe.seasonings}" th:text="${seasoning}"></li>
                    </ul>

                    <h4>🍳 步驟：</h4>
                    <ol>
                        <li th:each="step : ${recipe.steps}" th:text="${step}"></li>
                    </ol>
                </div>
                
                <div class="tags-container">
                    <span th:each="keyword : ${recipe.keywords}" 
                          class="keyword-tag" 
                          th:text="|# ${keyword}|">
                    </span>
                </div>

                <div class="favorite-actions">
                    <form th:action="@{/favorite/remove}" method="post">
                        <input type="hidden" name="recipeId" th:value="${recipe.id}" />
                        
                        <button type="submit" class="btn-remove" 
                                th:data-name="${recipe.name}"
                                onclick="return confirm('確定要將「' + this.getAttribute('data-name') + '」從收藏中移除嗎？');">
                            💔 取消收藏
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <footer th:replace="~{layout/fragments :: footer}"></header>
</body>
</html>
