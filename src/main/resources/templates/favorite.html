<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - 快速料理小幫手</title>
    
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/favorite.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico?v=1}">
</head>
<body>
    <header th:replace="~{layout/fragments :: header}"></header>

    <main class="favorite-container">
        
        <div class="message-block">
            <span th:if="${successMsg}" th:text="${successMsg}" class="msg-success"></span>
            <span th:if="${errorMsg}" th:text="${errorMsg}" class="msg-error"></span>
        </div>

        <h1 class="page-title">❤️ 我收藏的美味食譜</h1>
        
        <div th:if="${#lists.isEmpty(favorites)}" class="empty-state-card">
            <div class="empty-state-icon">🍳</div>
            <p class="empty-state-text">目前的收藏清單空空如也喔！</p>
            <a th:href="@{/recipe}" class="btn-go-explore">🔍 馬上去探索食譜</a>
        </div>
        
        <div th:unless="${#lists.isEmpty(favorites)}">
            
            <div class="favorite-grid-container">
                
                <div th:each="recipe : ${favorites}" class="favorite-summary-card">
                    
                    <div class="card-img-wrapper">
                        <img th:src="@{${recipe.imageUrl != null ? recipe.imageUrl : '/images/system/not-uploaded.jpg'}}" 
                             alt="食譜圖片" class="card-img">
                    </div>

                    <div class="card-info">
                        <h3 class="recipe-title" th:text="${recipe.name}">食譜名稱</h3>
                        <p class="recipe-time">⏱️ 烹調時間：<span th:text="${recipe.cookingTime}"></span> 分鐘</p>

                        <div class="card-actions">
                            <a th:href="@{/recipe/detail/{id}(id=${recipe.id})}" class="btn-detail">查看詳情</a>
                            
                            <form th:action="@{/favorite/remove}" method="post" style="margin: 0; display: flex; flex: 1;">
                                <input type="hidden" name="recipeId" th:value="${recipe.id}" />
                                <button type="submit" class="btn-remove" 
                                        th:data-name="${recipe.name}"
                                        onclick="return confirm('確定要將「' + this.getAttribute('data-name') + '」從收藏中移除嗎？');">
                                    💔 移除
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                
            </div>
            
        </div>
    </main>

    <footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
