<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索食譜 - 快速料理小幫手</title>
    
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/recipe-list.css}">
    
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico?v=1}">
</head>
<body>
    <header th:replace="~{layout/fragments :: header}"></header>

    <main class="recipe-list-container">

        <div style="text-align: center; margin-bottom: 20px;">
            <span th:if="${successMsg}" th:text="${successMsg}" style="color: #2E8B57; font-weight: bold; background-color: #e6f4ea; padding: 10px 20px; border-radius: 8px; display: inline-block;"></span>
            <span th:if="${errorMsg}" th:text="${errorMsg}" style="color: #ba714d; font-weight: bold; background-color: #fbe9e7; padding: 10px 20px; border-radius: 8px; display: inline-block;"></span>
        </div>

        <h1 class="page-title">探索美味食譜</h1>
        
        <div th:each="entry : ${typeRecipes}" class="cuisine-section">
          
            <h2 class="cuisine-title" th:text="|🎌 ${entry.key}料理|">分類名稱</h2>
            
            <div th:each="recipe : ${entry.value}" class="recipe-detail-card">
                
                <div class="recipe-header">
                    <h3 th:text="${recipe.name}">食譜名稱</h3>
                    <span class="cooking-time">⏱️ 烹調時間：<span th:text="${recipe.cookingTime}"></span> 分鐘</span>
                </div>

                <div th:if="${recipe.videoUrl != null}" class="video-container">
                    <iframe width="100%" height="315" 
                            th:src="${recipe.videoUrl}" 
                            title="YouTube video player" frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                    </iframe>
                </div>

                <div class="recipe-content">
                    <h4>🛒 食材：</h4>
                    <ul>
                        <li th:each="ingredient : ${recipe.ingredients}" th:text="${ingredient}"></li>
                    </ul>

                    <h4>🧂 調味料：</h4>
                    <ul>
                        <li th:each="seasoning : ${recipe.seasonings}" th:text="${seasoning}"></li>
                    </ul>

                    <h4>🍳 步驟：</h4>
                    <ol>
                        <li th:each="step : ${recipe.steps}" th:text="${step}"></li>
                    </ol>
                </div>
                
                <div class="tags-container">
                    <span th:each="keyword : ${recipe.keywords}" 
                          class="keyword-tag" 
                          th:text="|# ${keyword}|">
                    </span>
                </div>

                <div class="favorite-actions" style="margin-top: 25px; text-align: right; border-top: 1px dashed #ddd; padding-top: 20px;">
                    <form th:action="@{/favorite/add}" method="post">
                        <input type="hidden" name="recipeId" th:value="${recipe.id}" />
                        <button type="submit" class="btn-collect">❤️ 加入收藏</button>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <footer th:replace="~{layout/fragments :: footer}"></footer>

    
</body>
</html>
