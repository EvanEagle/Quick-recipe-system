<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索食譜 - 快速料理小幫手</title>
    
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/recipe-list.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico?v=1}">
</head>
<body>
    <header th:replace="~{layout/fragments :: header}"></header>

    <main class="recipe-list-container">

        <div style="text-align: center; margin-bottom: 20px;">
            <span th:if="${successMsg}" th:text="${successMsg}" style="color: #2E8B57; font-weight: bold; background-color: #e6f4ea; padding: 10px 20px; border-radius: 8px; display: inline-block;"></span>
            <span th:if="${errorMsg}" th:text="${errorMsg}" style="color: #ba714d; font-weight: bold; background-color: #fbe9e7; padding: 10px 20px; border-radius: 8px; display: inline-block;"></span>
        </div>

        <h1 class="page-title">探索美味食譜</h1>
        
        <div th:each="entry : ${recipes}" class="cuisine-section">
          
            <h2 class="cuisine-title" th:text="|🎌 ${entry.key}料理|">分類名稱</h2>
            
            <div class="recipe-grid-container">
                
                <div th:each="recipe : ${entry.value}" class="recipe-summary-card">
                    
                    <div class="card-img-wrapper">
                        <img th:src="@{${recipe.imageUrl != null ? recipe.imageUrl : '/images/system/not-uploaded.jpg'}}" 
                             alt="食譜圖片" class="card-img">
                    </div>

                    <div class="card-info">
                        <h3 class="recipe-title" th:text="${recipe.name}">食譜名稱</h3>
                        <p class="recipe-time">⏱️ 烹調時間：<span th:text="${recipe.cookingTime}"></span> 分鐘</p>
                        

                        <div class="card-actions">
                            <a th:href="@{/recipe/detail/{id}(id=${recipe.id})}" class="btn-detail">查看詳情</a>
                            
                            <form th:action="@{/favorite/add}" method="post" style="margin: 0; display: flex; flex: 1;">
                                <input type="hidden" name="recipeId" th:value="${recipe.id}" />
                                <button type="submit" class="btn-collect">❤️ 收藏</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
