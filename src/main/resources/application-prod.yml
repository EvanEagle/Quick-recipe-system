server:
  port: ${PORT:8080}

spring:
  datasource:
    # 本機 Docker Compose 可使用 db；雲端則用 SPRING_DATASOURCE_URL 覆寫。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/recipe_db?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  image:
    # Railway / Docker Volume 建議掛載到 /app/images，食譜圖片放 recipes 子目錄。
    recipe-directory: ${APP_RECIPE_IMAGE_DIR:/app/images/recipes}

upload:
  # 舊設定保留相容性；目前 WebMvcConfig 已只映射食譜上傳目錄。
  path: ${APP_IMAGE_ROOT:/app/images}
